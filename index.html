<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電視簡報投影系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #img-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        img {
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
            /* 讓放大縮小有平滑過渡動畫效果 */
            transition: transform 0.2s ease-in-out;
            transform-origin: center center;
        }
        /* 右下角浮動頁碼樣式 */
        #page-indicator {
            position: absolute;
            bottom: 25px;
            right: 35px;
            background-color: rgba(0, 0, 0, 0.7);
            color: #ffffff;
            font-size: 22px;
            font-family: Arial, sans-serif;
            padding: 8px 18px;
            border-radius: 20px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 999;
        }
    </style>
</head>
<body>
    <div id="img-container">
        <!-- 預設顯示第一頁（已改為 slide_01.PNG） -->
        <img id="presentation" src="slide_01.PNG" alt="簡報">
    </div>
    
    <!-- 頁碼浮動標籤 -->
    <div id="page-indicator">1 / 26</div>

    <script>
        // 1. 自動生成 26 頁 slide_01.PNG 至 slide_26.PNG
        const totalPages = 26;
        const pages = [];
        for (let i = 1; i <= totalPages; i++) {
            let num = i < 10 ? "0" + i : i;
            pages.push("slide_" + num + ".PNG");
        }

        let currentIndex = 0;
        let zoomLevel = 1.0; // 預設縮放倍率
        let hideTimer = null;

        const imgElement = document.getElementById("presentation");
        const indicator = document.getElementById("page-indicator");

        // 自動請求進入全螢幕
        function enterFullscreen() {
            const elem = document.documentElement;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(() => {});
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                }
            }
        }

        // 更新圖片與畫面呈現
        function updateDisplay() {
            imgElement.src = pages[currentIndex];
            resetZoom();
            showPageIndicator();
        }

        // 放大畫面
        function zoomIn() {
            if (zoomLevel < 2.5) { // 最高放大至 2.5 倍
                zoomLevel += 0.25;
                applyZoom();
            }
        }

        // 縮小畫面
        function zoomOut() {
            if (zoomLevel > 1.0) { // 最低回歸 1.0 倍
                zoomLevel -= 0.25;
                applyZoom();
            }
        }

        // 重置放大倍率
        function resetZoom() {
            zoomLevel = 1.0;
            applyZoom();
        }

        function applyZoom() {
            imgElement.style.transform = `scale(${zoomLevel})`;
        }

        // 顯示頁碼，並在 2 秒後自動消失
        function showPageIndicator() {
            indicator.innerText = `${currentIndex + 1} / ${totalPages}`;
            indicator.style.opacity = "1";
            
            clearTimeout(hideTimer);
            hideTimer = setTimeout(() => {
                indicator.style.opacity = "0";
            }, 2000);
        }

        // 下一頁
        function showNext() {
            if (currentIndex < pages.length - 1) {
                currentIndex++;
                updateDisplay();
            }
        }

        // 上一頁
        function showPrev() {
            if (currentIndex > 0) {
                currentIndex--;
                updateDisplay();
            }
        }

        // 遙控器按鍵控制邏輯
        window.addEventListener("keydown", function(event) {
            // 只要按任意鍵，即嘗試啟動全螢幕
            enterFullscreen();

            switch(event.keyCode) {
                case 39: // 右鍵 -> 下一頁
                    showNext();
                    break;
                case 37: // 左鍵 -> 上一頁
                    showPrev();
                    break;
                case 38: // 上鍵 -> 畫面放大
                    zoomIn();
                    break;
                case 40: // 下鍵 -> 畫面縮小
                    zoomOut();
                    break;
                case 13: // OK/確定鍵 -> 若有放大則重置倍率，沒放大則下一頁
                    if (zoomLevel > 1.0) {
                        resetZoom();
                    } else {
                        showNext();
                    }
                    break;
            }
        });

        // 支援點擊（飛鼠遙控器/點選螢幕時全螢幕並下一頁）
        document.body.addEventListener("click", function(e) {
            enterFullscreen();
            showNext();
        });

        // 初始載入顯示頁碼
        showPageIndicator();
    </script>
</body>
</html>

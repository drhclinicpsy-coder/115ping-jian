<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>簡報展示</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #slide {
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    background: #000;
  }

  .hint {
    position: fixed;
    bottom: 12px;
    right: 16px;
    color: rgba(255,255,255,0.35);
    font-family: Arial, sans-serif;
    font-size: 14px;
    pointer-events: none;
    z-index: 10;
  }

  /* 左上角備用全螢幕按鈕 */
  #fullscreen-btn {
    position: fixed;
    top: 12px;
    left: 12px;
    background: rgba(0, 0, 0, 0.5);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.4);
    padding: 6px 12px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    z-index: 100;
    opacity: 0.5;
  }
  #fullscreen-btn:hover {
    opacity: 1;
  }
</style>
</head>
<body>

<!-- 點擊此按鈕亦可直接進入/退出全螢幕 -->
<button id="fullscreen-btn" onclick="toggleFullscreen()">全螢幕</button>

<img id="slide" src="slide_01.PNG" alt="slide">
<div class="hint" id="hint">1 / 29</div>

<script>
  const totalSlides = 29;
  let current = 1;

  const slide = document.getElementById('slide');
  const hint = document.getElementById('hint');

  function pad(num) {
    return String(num).padStart(2, '0');
  }

  function showSlide(num) {
    if (num < 1) num = 1;
    if (num > totalSlides) num = totalSlides;

    current = num;
    slide.src = 'slide_' + pad(current) + '.PNG';
    hint.textContent = current + ' / ' + totalSlides;
  }

  // 請求進入全螢幕
  function enterFullscreen() {
    const elem = document.documentElement;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(() => {});
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      }
    }
  }

  // 手動切換全螢幕
  function toggleFullscreen() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      enterFullscreen();
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
    }
  }

  document.addEventListener('keydown', function(e) {
    // 第一次按遙控器按鍵時自動進入全螢幕
    enterFullscreen();

    if (
      e.key === 'ArrowRight' ||
      e.key === 'PageDown' ||
      e.key === 'Enter' ||
      e.key === ' '
    ) {
      showSlide(current + 1);
    }

    if (
      e.key === 'ArrowLeft' ||
      e.key === 'PageUp' ||
      e.key === 'Backspace'
    ) {
      showSlide(current - 1);
    }
  });

  document.addEventListener('click', function(e) {
    if (e.target.id !== 'fullscreen-btn') {
      enterFullscreen();
      showSlide(current + 1);
    }
  });

  let touchStartX = 0;

  document.addEventListener('touchstart', function(e) {
    touchStartX = e.changedTouches[0].screenX;
  });

  document.addEventListener('touchend', function(e) {
    enterFullscreen();
    let touchEndX = e.changedTouches[0].screenX;
    if (touchStartX - touchEndX > 50) {
      showSlide(current + 1);
    }
    if (touchEndX - touchStartX > 50) {
      showSlide(current - 1);
    }
  });
</script>

</body>
</html>
